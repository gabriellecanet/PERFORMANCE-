<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);--bg:#0a0a0b;--c1:#141416;--c2:#1c1c1f;--tx:#ece8df;--t2:#9a9a9f;--t3:#5c5c62;--gd:#b89b5e;--ok:#6fae85;--wa:#c9955a;--ln:#26262a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Helvetica Neue",Inter,Arial,sans-serif;max-width:520px;margin:0 auto;padding:0 16px 110px}
h1{font-size:13px;letter-spacing:.35em;font-weight:600;margin:18px 0 2px;color:var(--gd)}
.sub{font-size:11px;letter-spacing:.2em;color:var(--t2);text-transform:uppercase}
.card{background:var(--c1);border:1px solid var(--ln);border-radius:16px;padding:16px;margin:14px 0}
.lbl{font-size:10px;letter-spacing:.22em;color:var(--t2);text-transform:uppercase;margin-bottom:8px}
.big{font-size:56px;font-weight:200;letter-spacing:-.02em;line-height:1}
.big small{font-size:18px;color:var(--t2);letter-spacing:.1em;margin-left:6px}
.mid{font-size:28px;font-weight:300}
.row{display:flex;gap:10px;align-items:center}.sp{justify-content:space-between}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.msg{color:var(--gd);font-size:12px;letter-spacing:.2em;text-transform:uppercase;margin-top:10px}
.bar{height:3px;background:var(--c2);border-radius:3px;margin-top:14px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gd);transition:width .6s}
.it{display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid var(--ln);font-size:15px}.it:last-child{border:0}
.ck{width:24px;height:24px;border:1.5px solid var(--t3);border-radius:50%;flex:none;display:grid;place-items:center;transition:.25s;background:none;color:#000;font-size:13px;padding:0}
.it.d .ck{background:var(--gd);border-color:var(--gd);transform:scale(1.08)}.it.d span.n{color:var(--t3);text-decoration:line-through}
.n{flex:1}.tag{font-size:10px;letter-spacing:.15em;color:var(--t3)}
.btn{background:var(--c2);color:var(--tx);border:1px solid var(--ln);border-radius:12px;padding:12px 14px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;cursor:pointer;flex:1}
.btn.g{background:var(--gd);color:#000;border-color:var(--gd);font-weight:600}.btn.x{color:var(--t3);flex:none;padding:6px 10px}
.pills{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}.pills b{font-weight:400;font-size:10px;letter-spacing:.15em;padding:6px 10px;border:1px solid var(--ln);border-radius:20px;color:var(--t2);cursor:pointer}.pills b.on{color:#000;background:var(--gd);border-color:var(--gd)}
svg{width:100%;height:auto;display:block}.ro{font-size:11px;color:var(--t2);min-height:16px;letter-spacing:.08em;margin-top:6px}
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(10,10,11,.94);backdrop-filter:blur(14px);border-top:1px solid var(--ln);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav div{display:flex;width:100%;max-width:520px;justify-content:space-around;padding:6px 4px}
nav a{font-size:9px;letter-spacing:.16em;color:var(--t3);padding:14px 6px;cursor:pointer}nav a.on{color:var(--gd)}
.fab{position:fixed;bottom:calc(66px + env(safe-area-inset-bottom,0px));right:calc(50% - 244px);width:46px;height:46px;border-radius:50%;background:var(--gd);color:#000;font-size:24px;border:0;z-index:6;cursor:pointer}
@media(max-width:540px){.fab{right:16px}}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:9;display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:var(--c1);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));max-height:85%;overflow:auto}
input,select{width:100%;background:var(--c2);border:1px solid var(--ln);color:var(--tx);border-radius:10px;padding:12px;font-size:16px;margin-bottom:10px}
.hm{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;gap:3px}.hm i{aspect-ratio:1;border-radius:3px;background:var(--c2);cursor:pointer}
.empty{text-align:center;padding:50px 10px}.empty h2{font-weight:300;letter-spacing:.2em;font-size:16px}.empty p{color:var(--t2);font-size:13px}
.scroll{overflow-x:auto}.pg{font-size:12px;color:var(--t2)}
:root[data-theme=light]{--bg:#f6f4ef;--c1:#fff;--c2:#efece5;--tx:#16161a;--t2:#6b6b72;--t3:#a5a5ab;--ln:#e4e0d6;--gd:#9a7b3c}
[data-theme=light] .card{box-shadow:0 1px 10px rgba(0,0,0,.04)}[data-theme=light] nav{background:rgba(246,244,239,.94)}[data-theme=light] .sheet{background:rgba(0,0,0,.35)}
[data-theme=light] .btn.g,[data-theme=light] .fab,[data-theme=light] .it.d .ck,[data-theme=light] .pills b.on{color:#fff}
.it.tk .ck{border-radius:7px}
html{background:var(--bg)}html,body{overscroll-behavior:none}body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}input{-webkit-user-select:text;user-select:text}

<script>
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const addD=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return ymd(d)};
const wd=s=>(new Date(s+'T12:00:00').getDay()+6)%7;
const TD=()=>ymd(new Date());
const uid=()=>Math.random().toString(36).slice(2,9);
let S={habits:[],hd:{},tasks:[],weights:[],matches:[],goals:[],tw:null};
try{const r=localStorage.getItem('perf_v1');if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
let DB=null,ME=null,syncT=null,sst='LOCAL';
const pushDb=()=>{if(!DB)return;DB.set({json:JSON.stringify(S),t:S._t||Date.now()}).then(()=>{sst='SYNC'}).catch(()=>{sst='ERR'})};
const save=()=>{S._t=Date.now();try{localStorage.setItem('perf_v1',JSON.stringify(S))}catch(e){}if(DB){clearTimeout(syncT);syncT=setTimeout(pushDb,700)}};
const hasData=()=>S.habits.length||S.tasks.length||S.weights.length||S.matches.length||S.goals.length;
async function initSync(){try{if(!window.claude)return;const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);if(!db||!user)return;const id=await user.id();if(!id)return;ME=await user.me().catch(()=>null);DB=db.collection('data/users/'+id).doc('perf');
 const sn=await DB.get();if(sn.exists){const d=sn.data();if((d.t||0)>(S._t||0)){S=Object.assign({habits:[],hd:{},tasks:[],weights:[],matches:[],goals:[],tw:null},JSON.parse(d.json));try{localStorage.setItem('perf_v1',JSON.stringify(S))}catch(e){}}else pushDb()}else if(hasData())pushDb();sst='SYNC';render()}catch(e){DB=null;sst='LOCAL'}}
let tab='HOME',wr='30J',mr=10,sel=null;
const TABS=['HOME','TODAY','PROGRESS','STATS','SETTINGS'];

function items(d){const a=S.habits.filter(h=>h.days.includes(wd(d))).map(h=>({id:h.id,n:h.name,w:h.w,k:'h',tm:h.time,done:(S.hd[d]||[]).includes(h.id)}));
 S.tasks.filter(t=>t.date==d).forEach(t=>a.push({id:t.id,n:t.name,w:t.w,k:'t',tm:t.time,done:t.done}));return a}
function score(d){const a=items(d);if(!a.length)return null;const T=a.reduce((s,x)=>s+x.w,0);return Math.round(a.filter(x=>x.done).reduce((s,x)=>s+x.w,0)/T*100)}
function wins(d){return items(d).filter(x=>x.done).length}
function toggle(k,id,d){if(k=='h'){const l=S.hd[d]=S.hd[d]||[];const i=l.indexOf(id);i<0?l.push(id):l.splice(i,1)}else{const t=S.tasks.find(t=>t.id==id);t.done=!t.done}save();render()}
function range(n,end){const a=[];for(let i=n-1;i>=0;i--)a.push(addD(end||TD(),-i));return a}
function consistency(n){const s=range(n).map(score).filter(x=>x!==null);return s.length?Math.round(s.reduce((a,b)=>a+b,0)/s.length):null}
function totalWins(){let t=S.tasks.filter(x=>x.done).length;Object.values(S.hd).forEach(l=>t+=l.length);return t}
function weekWins(off){return range(7,addD(TD(),-7*off)).reduce((s,d)=>s+wins(d),0)}
function streak(h){let n=0,d=TD();if(!(S.hd[d]||[]).includes(h.id))d=addD(d,-1);for(let i=0;i<400;i++){if(!h.days.includes(wd(d))){d=addD(d,-1);continue}if((S.hd[d]||[]).includes(h.id)){n++;d=addD(d,-1)}else break}return n}
function best(h){let b=0,c=0;Object.keys(S.hd).sort().forEach(d=>{if(S.hd[d].includes(h.id)){c++;b=Math.max(b,c)}else c=0});return b}
function wsorted(){return [...S.weights].sort((a,b)=>a.d<b.d?-1:1)}
function avgW(n){const w=wsorted().filter(x=>x.d>addD(TD(),-n));return w.length?(w.reduce((s,x)=>s+x.v,0)/w.length):null}
const f1=v=>v==null?'—':v.toFixed(1);
function msg(w,t){if(!t)return'';if(!w)return'PRÊT QUAND TU VEUX';if(w==t)return'JOURNÉE PARFAITE · '+w+' PETITES VICTOIRES';return w>=t*.6?'BELLE JOURNÉE · '+w+' PETITES VICTOIRES':w+' PETITES VICTOIRES · CONTINUE'}

const NL={HOME:'ACCUEIL',TODAY:'JOUR',PROGRESS:'PROGRÈS',STATS:'STATS',SETTINGS:'RÉGLAGES'};
let K={};function applyTheme(){const m=S.theme||'auto';const l=m=='light'||(m=='auto'&&matchMedia('(prefers-color-scheme: light)').matches);document.documentElement.dataset.theme=l?'light':'dark';const cs=getComputedStyle(document.documentElement),g=n=>cs.getPropertyValue(n).trim();K={tx:g('--tx'),t3:g('--t3'),gd:g('--gd'),ln:g('--ln')}}
const setTheme=v=>{S.theme=v;save();render()};
function weekCard(){const w=range(7),act=w.filter(d=>wins(d)>0).length,bd=w.map(d=>({d,s:score(d)})).filter(x=>x.s!=null).sort((a,b)=>b.s-a.s)[0],nm=S.matches.filter(m=>m.d>addD(TD(),-7)).length,c=consistency(7),av=avgW(7);
 const hc=S.habits.map(h=>({n:h.name,c:w.filter(d=>(S.hd[d]||[]).includes(h.id)).length})).sort((a,b)=>b.c-a.c)[0];
 const L=(a,b)=>`<div class="it" style="padding:9px 0"><span class="n pg">${a}</span><span>${b}</span></div>`;

/* charts */
function line(pts,o={}){if(!pts.length)return'<div class="pg">PAS ENCORE DE DONNÉES</div>';const W=320,H=150,p=14;
 let ys=pts.map(x=>x.y).concat(o.avg?o.avg.map(x=>x.y):[]);if(o.target!=null)ys.push(o.target);
 let mn=Math.min(...ys),mx=Math.max(...ys);if(mn==mx){mn-=1;mx+=1}const e=(mx-mn)*.1;mn-=e;mx+=e;
 const X=i=>pts.length<2?W/2:p+i*(W-2*p)/(pts.length-1),Y=v=>H-p-(v-mn)/(mx-mn)*(H-2*p);
 const path=a=>a.map((x,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(x.y).toFixed(1)).join('');
 let s=`<svg viewBox="0 0 ${W} ${H}">`;
 if(o.target!=null)s+=`<line x1="0" x2="${W}" y1="${Y(o.target)}" y2="${Y(o.target)}" stroke="${K.gd}" stroke-dasharray="3 4" opacity=".5"/>`;
 s+=`<path d="${path(pts)}" fill="none" stroke="${o.avg?K.t3:K.tx}" stroke-width="1.2" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"><animate attributeName="stroke-dashoffset" to="0" dur=".8s" fill="freeze"/></path>`;
 if(o.avg)s+=`<path d="${path(o.avg)}" fill="none" stroke="${K.gd}" stroke-width="2"/>`;
 pts.forEach((x,i)=>s+=`<circle cx="${X(i)}" cy="${Y(x.y)}" r="${pts.length>40?6:9}" fill="transparent" fill-opacity="${pts.length>40?0:.01}" onclick="document.getElementById('${o.id}').textContent='${x.l} — ${x.t}'"/><circle cx="${X(i)}" cy="${Y(x.y)}" r="2" fill="${K.tx}" pointer-events="none"/>`);
 return s+`</svg><div class="ro" id="${o.id}">TOUCHE UN POINT</div>`}
function bars(v,o={}){const W=320,H=130,mx=Math.max(1,...v.map(x=>x.y)),bw=(W-8)/v.length;
 let s=`<svg viewBox="0 0 ${W} ${H+16}">`;v.forEach((x,i)=>{const h=x.y/mx*(H-14);s+=`<rect x="${4+i*bw+bw*.18}" y="${H-h}" width="${bw*.64}" height="${Math.max(h,1)}" rx="2" fill="${x.y?K.gd:K.ln}" opacity=".9"><title>${x.l}: ${x.t}</title></rect><text x="${4+i*bw+bw/2}" y="${H+12}" fill="${K.t3}" font-size="8" text-anchor="middle">${x.l}</text>`});return s+'</svg>'}

function editTask(id){const t=S.tasks.find(x=>x.id==id);sheet('MODIFIER LA TÂCHE',[{k:'n',v:t.name},{k:'d',t:'date',v:t.date}],v=>{t.name=v.n||t.name;t.date=v.d||t.date});}
function delTask(id){S.tasks=S.tasks.filter(t=>t.id!=id);save();render()}
function addWeight(){const l=wsorted().slice(-1)[0],lf=[...S.fat].sort((a,b)=>a.d<b.d?-1:1).slice(-1)[0];sheet('MESURES DU JOUR',[{k:'v',t:'number',p:'Poids (kg) — ex. 85.8',v:l?l.v:''},{k:'f',t:'number',p:'Masse grasse (%) — facultatif',v:lf?lf.v:''}],v=>{const n=parseFloat(String(v.v).replace(',','.')),f=parseFloat(String(v.f).replace(',','.'));if(!(n>0)&&!(f>0))return false;if(n>0){S.weights=S.weights.filter(w=>w.d!=TD());S.weights.push({d:TD(),v:n})}if(f>0){S.fat=S.fat.filter(w=>w.d!=TD());S.fat.push({d:TD(),v:f})}})}
function setTw(){sheet('POIDS CIBLE (KG)',[{k:'v',t:'number',v:S.tw||''}],v=>{S.tw=parseFloat(String(v.v).replace(',','.'))||null})}
function addMatch(){sheet('MATCH',[{k:'d',t:'date',v:TD()},{k:'o',p:'Adversaire'},{k:'m',t:'number',p:'Minutes'},{k:'s',t:'number',p:'Tirs reçus'},{k:'a',t:'number',p:'Arrêts'},{k:'p',t:'number',p:'7 m reçus'},{k:'q',t:'number',p:'7 m arrêtés'},{k:'r',t:'select',o:[['','Résultat'],['V','Victoire'],['N','Nul'],['D','Défaite']]}],v=>{const s=+v.s,a=+v.a;if(!(s>0)||a>s||a<0)return false;S.matches.push({id:uid(),d:v.d||TD(),opp:v.o,min:+v.m||0,shots:s,saves:a,p7:+v.p||0,p7s:+v.q||0,res:v.r})})}
function delMatch(id){S.matches=S.matches.filter(m=>m.id!=id);save();render()}
function addHabit(id){const h=id&&S.habits.find(x=>x.id==id);sheet((h?'MODIFIER L’HABITUDE':'NOUVELLE HABITUDE')+' · rappel à l’heure (facultatif)',[{k:'n',p:'Nom (ex. Mobilité 15 min)',v:h?h.name:''},{k:'w',t:'number',p:'Poids dans le score (défaut 10)',v:h?h.w:''},{k:'d',t:'select',o:[['all','Tous les jours'],['wk','En semaine'],['we','Week-end'],['mwf','Lun · Mer · Ven']],v:h&&h.days.length<7?'':'all'},{k:'h',t:'time',v:h?h.time||'':''}],v=>{if(!v.n.trim())return false;const days={all:[0,1,2,3,4,5,6],wk:[0,1,2,3,4],we:[5,6],mwf:[0,2,4]}[v.d];if(h){h.name=v.n;h.w=+v.w||10;h.time=v.h;if(!(h.days.length<7&&v.d=='all'&&false))h.days=days}else S.habits.push({id:uid(),name:v.n.trim(),w:+v.w||10,days,time:v.h})})}
function delHabit(id){if(confirm('Supprimer cette habitude ?')){S.habits=S.habits.filter(h=>h.id!=id);save();render()}}
function addGoal(){sheet('NOUVEL OBJECTIF · échéance facultative',[{k:'n',p:'Nom (ex. 14 % de masse grasse)'},{k:'k',t:'select',o:[['weight','Poids (kg)'],['fat','Masse grasse (%)'],['save','% d’arrêts'],['cons','Régularité %'],['manual','Nombre manuel']]},{k:'t',t:'number',p:'Valeur cible'},{k:'c',t:'number',p:'Valeur de départ (manuel seulement)'},{k:'u',t:'date'}],v=>{const t=parseFloat(String(v.t).replace(',','.'));if(!v.n.trim()||!t)return false;const lw=wsorted().slice(-1)[0],lf=[...S.fat].sort((a,b)=>a.d<b.d?-1:1).slice(-1)[0];S.goals.push({id:uid(),name:v.n.trim(),kind:v.k,target:t,cur:+v.c||0,start:v.k=='weight'?(lw?lw.v:0):v.k=='fat'?(lf?lf.v:0):v.k=='manual'?(+v.c||0):0,due:v.u})})}
function editGoal(id){const g=S.goals.find(x=>x.id==id);sheet('MODIFIER L’OBJECTIF',[{k:'n',v:g.name},{k:'t',t:'number',v:g.target},...(g.kind=='manual'?[{k:'c',t:'number',v:g.cur}]:[]),{k:'u',t:'date',v:g.due||''}],v=>{g.name=v.n||g.name;g.target=parseFloat(String(v.t).replace(',','.'))||g.target;if(v.c!==undefined)g.cur=+v.c;g.due=v.u})}
function delGoal(id){S.goals=S.goals.filter(g=>g.id!=id);save();render()}
const setWr=v=>{wr=v;render()},setMr=v=>{mr=v;render()};
function render(){applyTheme();S.fat=S.fat||[];const y=window.scrollY;$('#app').innerHTML={HOME:home,TODAY:today,PROGRESS:progress,STATS:stats,SETTINGS:settings}[tab]();
 $('#nav').innerHTML=TABS.map(t=>`<a class="${t==tab?'on':''}" onclick="tab='${t}';render();scrollTo(0,0)">${NL[t]}</a>`).join('');window.scrollTo(0,y)}
render();initSync();setTimeout(checkRem,1500);
</script></body></html>
